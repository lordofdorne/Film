# Local Postgres for development and for the tests that must run against a real
# database. The stage-execution constraint depends on Postgres semantics
# (UNIQUE NULLS NOT DISTINCT), which no mock or in-memory shim can verify.
services:
  postgres:
    image: postgres:16-alpine
    container_name: film-pg
    environment:
      POSTGRES_PASSWORD: film
      POSTGRES_DB: film
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
